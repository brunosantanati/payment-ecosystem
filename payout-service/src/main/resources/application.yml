server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: payout-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payout_db}
    username: ${SPRING_DATASOURCE_USERNAME:payout_user}
    password: ${SPRING_DATASOURCE_PASSWORD:payout_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    aws:
      sqs:
        listener:
          message-visibility: 60s
      region:
        static: us-east-1

app:
  sqs:
    payout-commands-queue: payment-ecosystem-payout-commands
    payout-commands-dlq: payment-ecosystem-payout-commands-dlq
  p2a:
    base-url: ${APP_P2A_BASE_URL:http://localhost:8080}
    connect-timeout: 5s
    read-timeout: 10s